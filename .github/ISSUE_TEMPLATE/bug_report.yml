name: Bug report
description: Something snap-back did wrong, or failed to do
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        If snap-back lost or changed files, say so in the title. Every restore records a safety
        snapshot first: `snap-back list` shows it with kind `safety`, and `snap-back restore <id>`
        brings that state back.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: The command you ran, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Ideally a script that creates a temp directory and reproduces the problem there.
      placeholder: |
        mkdir /tmp/sb && cd /tmp/sb
        echo a > a.txt
        snap-back snap
        ...
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output
      description: Output of the failing command, plus `snap-back status`. Re-run with `SNAP_BACK_DEBUG=1` for a stack trace.
      render: text
  - type: input
    id: version
    attributes:
      label: snap-back version
      placeholder: snap-back --version
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: OS, Node and git versions
      placeholder: macOS 15, node 22.11, git 2.47
    validations:
      required: true
  - type: input
    id: agent
    attributes:
      label: Agent and capture mode
      placeholder: Codex with `snap-back wrap`, Claude Code hooks, Cursor with `snap-back watch`, ...
